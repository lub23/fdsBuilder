<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
<linearGradient id="warnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#D97706"/>
<stop offset="100%" stop-color="#B45309"/>
</linearGradient>
<linearGradient id="infoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#2196F3"/>
<stop offset="100%" stop-color="#1565C0"/>
</linearGradient>
</defs>

<rect width="1280" height="720" fill="#FFFFFF"/>

<!-- Header -->
<rect x="0" y="0" width="1280" height="60" fill="#1B3A6B"/>
<text x="60" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">
<tspan>1.4 SVM表现分析与融合策略</tspan>
</text>
<text x="1220" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A90D9" text-anchor="end">
<tspan>航空航天设施</tspan>
</text>

<!-- Left column: SVM analysis -->
<g transform="translate(60, 85)">
<text x="0" y="20" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1B3A6B">
<tspan>SVM表现分析 (准确率 76.9%)</tspan>
</text>

<!-- Key finding card -->
<rect x="0" y="35" width="540" height="80" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<rect x="0" y="35" width="8" height="80" rx="4" fill="url(#warnGrad)"/>
<text x="25" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E">
<tspan>SVM采用RBF核函数，在本任务上准确率仅76.9%</tspan>
</text>
<text x="25" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#78350F">
<tspan>显著低于RF(98.1%)、MLP(96.3%)、CNN1D(94.0%)</tspan>
</text>

<!-- Three reason cards -->
<text x="0" y="145" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>主要原因分析:</tspan>
</text>

<g transform="translate(0, 160)">
<rect x="0" y="0" width="540" height="70" rx="6" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<rect x="0" y="0" width="36" height="70" rx="6" fill="#1B3A6B"/>
<text x="18" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>1</tspan></text>
<text x="52" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1A2E">
<tspan>特征空间复杂度高</tspan>
</text>
<text x="52" y="50" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">
<tspan>23维输入含连续变量（开口比、热通量等）与类别特征混合，RBF核难以捕捉非线性交互</tspan>
</text>
</g>

<g transform="translate(0, 240)">
<rect x="0" y="0" width="540" height="70" rx="6" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<rect x="0" y="0" width="36" height="70" rx="6" fill="#1B3A6B"/>
<text x="18" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>2</tspan></text>
<text x="52" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1A2E">
<tspan>热源参数跨度大</tspan>
</text>
<text x="52" y="50" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">
<tspan>heat_flux从50到15000 W/m²，同类别内特征方差大，SVM间隔最大化泛化受限</tspan>
</text>
</g>

<g transform="translate(0, 320)">
<rect x="0" y="0" width="540" height="70" rx="6" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<rect x="0" y="0" width="36" height="70" rx="6" fill="#1B3A6B"/>
<text x="18" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>3</tspan></text>
<text x="52" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1A2E">
<tspan>数据集规模中等</tspan>
</text>
<text x="52" y="50" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">
<tspan>每类约1700条 — 不足以维持高斯核紧凑性，也未达深度学习所需样本量</tspan>
</text>
</g>

<!-- Training curves images -->
<text x="0" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A6B">
<tspan>模型训练曲线:</tspan>
</text>
<g transform="translate(0, 435)">
<image href="../images/mlp_training_curves.png" x="0" y="0" width="265" height="88" preserveAspectRatio="xMidYMid meet"/>
<image href="../images/cnn1d_training_curves.png" x="275" y="0" width="265" height="88" preserveAspectRatio="xMidYMid meet"/>
</g>
<text x="0" y="540" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#9CA3AF">
<tspan>左: MLP训练曲线  右: CNN1D训练曲线</tspan>
</text>
</g>

<!-- Right column: Fusion strategy -->
<g transform="translate(630, 85)">
<text x="0" y="20" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1B3A6B">
<tspan>融合权重分配策略</tspan>
</text>

<rect x="0" y="35" width="590" height="70" rx="8" fill="#F0F9FF" stroke="#2196F3" stroke-width="1"/>
<text x="20" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>基于验证集准确率的加权策略：各模型预测概率按归一化权重加权平均后输出最终预测结果</tspan>
</text>
<text x="20" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">
<tspan>同时计算预测不确定度作为模型可信度参考（均值0.086）</tspan>
</text>

<!-- Weight distribution - horizontal bars -->
<text x="0" y="130" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>权重分配:</tspan>
</text>

<g transform="translate(0, 145)">
<text x="0" y="18" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E"><tspan>RF（随机森林）</tspan></text>
<rect x="140" y="3" width="365" height="22" rx="4" fill="#16A34A" fill-opacity="0.2"/>
<rect x="140" y="3" width="364" height="22" rx="4" fill="#16A34A"/>
<text x="515" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#16A34A"><tspan>27.0%</tspan></text>
</g>

<g transform="translate(0, 185)">
<text x="0" y="18" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E"><tspan>MLP（多层感知机）</tspan></text>
<rect x="140" y="3" width="357" height="22" rx="4" fill="#2196F3" fill-opacity="0.2"/>
<rect x="140" y="3" width="357" height="22" rx="4" fill="#2196F3"/>
<text x="507" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2196F3"><tspan>26.4%</tspan></text>
</g>

<g transform="translate(0, 225)">
<text x="0" y="18" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E"><tspan>CNN1D（一维卷积）</tspan></text>
<rect x="140" y="3" width="353" height="22" rx="4" fill="#4A90D9" fill-opacity="0.2"/>
<rect x="140" y="3" width="353" height="22" rx="4" fill="#4A90D9"/>
<text x="503" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A90D9"><tspan>26.1%</tspan></text>
</g>

<g transform="translate(0, 265)">
<text x="0" y="18" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E"><tspan>SVM（支持向量机）</tspan></text>
<rect x="140" y="3" width="279" height="22" rx="4" fill="#D97706" fill-opacity="0.2"/>
<rect x="140" y="3" width="279" height="22" rx="4" fill="#D97706"/>
<text x="429" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#D97706"><tspan>20.6%</tspan></text>
</g>

<!-- Future plan -->
<text x="0" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>后续计划:</tspan>
</text>

<rect x="0" y="335" width="590" height="65" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<rect x="0" y="335" width="8" height="65" rx="4" fill="#DC2626"/>
<text x="24" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#991B1B">
<tspan>若FDS数据集验证后SVM仍显著落后于其他模型</tspan>
</text>
<text x="24" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#7F1D1D">
<tspan>→ 从融合模型中剔除SVM，仅保留RF、MLP、CNN1D进行加权融合</tspan>
</text>

<!-- Confusion matrix image -->
<text x="0" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A6B">
<tspan>测试集混淆矩阵:</tspan>
</text>
<image href="../images/confusion_matrices_all.png" x="0" y="440" width="590" height="200" preserveAspectRatio="xMidYMid meet"/>
</g>

<!-- Footer -->
<text x="60" y="700" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">
<tspan>06 / 16</tspan>
</text>
</svg>