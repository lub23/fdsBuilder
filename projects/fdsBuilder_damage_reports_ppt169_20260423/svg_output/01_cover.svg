<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
<linearGradient id="coverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1B3A6B"/>
<stop offset="50%" stop-color="#0F2540"/>
<stop offset="100%" stop-color="#091A2E"/>
</linearGradient>
<linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#2196F3"/>
<stop offset="100%" stop-color="#4A90D9"/>
</linearGradient>
<linearGradient id="titleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="50%" stop-color="#E0E0E0"/>
<stop offset="100%" stop-color="#FFFFFF"/>
</linearGradient>
</defs>

<!-- Full dark background -->
<rect width="1280" height="720" fill="url(#coverGradient)"/>

<!-- Subtle geometric decoration - top right corner -->
<rect x="900" y="0" width="380" height="280" fill="#FFFFFF" fill-opacity="0.02"/>
<polygon points="1280,0 1280,280 900,280" fill="#FFFFFF" fill-opacity="0.03"/>

<!-- Bottom accent bar -->
<rect x="0" y="680" width="1280" height="40" fill="#2196F3" fill-opacity="0.15"/>

<!-- Main title -->
<text x="640" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>热毁伤代理模型研究报告</tspan>
</text>

<!-- Decorative accent line under title -->
<rect x="340" y="305" width="600" height="3" rx="1.5" fill="url(#accentLine)"/>

<!-- Subtitle -->
<text x="640" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#4A90D9" text-anchor="middle">
<tspan>航空航天 · 机械加工 · 冶金设施</tspan>
</text>

<!-- Section tags -->
<g transform="translate(340, 420)">
<rect x="0" y="0" width="140" height="36" rx="4" fill="#2196F3" fill-opacity="0.2" stroke="#2196F3" stroke-width="1" stroke-opacity="0.4"/>
<text x="70" y="23" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64B5F6" text-anchor="middle"><tspan>航空航天</tspan></text>

<rect x="160" y="0" width="140" height="36" rx="4" fill="#16A34A" fill-opacity="0.2" stroke="#16A34A" stroke-width="1" stroke-opacity="0.4"/>
<text x="230" y="23" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4ADE80" text-anchor="middle"><tspan>机械加工</tspan></text>

<rect x="320" y="0" width="140" height="36" rx="4" fill="#D97706" fill-opacity="0.2" stroke="#D97706" stroke-width="1" stroke-opacity="0.4"/>
<text x="390" y="23" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FCD34D" text-anchor="middle"><tspan>冶金设施</tspan></text>
</g>

<!-- Footer line -->
<line x1="60" y1="640" x2="1220" y2="640" stroke="#4A90D9" stroke-width="1" stroke-opacity="0.3"/>

<!-- Footer info -->
<text x="640" y="670" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">
<tspan>FDS Builder 项目组</tspan>
</text>
<text x="640" y="695" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#9CA3AF" text-anchor="middle">
<tspan>2026年4月</tspan>
</text>

<!-- Decorative number - hero stat -->
<text x="1180" y="200" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#FFFFFF" fill-opacity="0.03" text-anchor="middle">
<tspan>98.1</tspan>
</text>
<text x="1180" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.05" text-anchor="middle">
<tspan>RF准确率</tspan>
</text>
</svg>