<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
<linearGradient id="cardGradP4" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#F8FAFC"/>
<stop offset="100%" stop-color="#FFFFFF"/>
</linearGradient>
<filter id="cardShadow">
<feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
<feOffset dx="0" dy="2"/>
<feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<rect width="1280" height="720" fill="#FFFFFF"/>

<!-- Header -->
<rect x="0" y="0" width="1280" height="60" fill="#1B3A6B"/>
<text x="60" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">
<tspan>1.2 特征工程与模型架构</tspan>
</text>
<text x="1220" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A90D9" text-anchor="end">
<tspan>航空航天设施</tspan>
</text>

<!-- Three feature cards -->
<!-- Card 1: 23维特征向量 -->
<g transform="translate(60, 80)">
<rect x="0" y="0" width="365" height="180" rx="10" fill="url(#cardGradP4)" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
<rect x="0" y="0" width="365" height="44" rx="10" fill="#1B3A6B"/>
<rect x="0" y="20" width="365" height="24" fill="#1B3A6B"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">
<tspan>建筑特征 18维</tspan>
</text>
<text x="20" y="75" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 几何参数：长度、宽度、高度</tspan>
</text>
<text x="20" y="97" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 开口比（门面积+窗面积/外墙面积）</tspan>
</text>
<text x="20" y="119" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 楼层数（影响火蔓延路径）</tspan>
</text>
<text x="20" y="141" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 门数量（通风/火灾条件）</tspan>
</text>
<text x="20" y="163" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#9CA3AF">
<tspan>捕捉建筑几何与火灾条件差异</tspan>
</text>
</g>

<!-- Card 2: 8维可燃物向量 -->
<g transform="translate(457, 80)">
<rect x="0" y="0" width="365" height="180" rx="10" fill="url(#cardGradP4)" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
<rect x="0" y="0" width="365" height="44" rx="10" fill="#2196F3"/>
<rect x="0" y="20" width="365" height="24" fill="#2196F3"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">
<tspan>可燃物特征 8维</tspan>
</text>
<text x="20" y="75" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>木质纸质 · 纺织品类 · 塑料高分子类</tspan>
</text>
<text x="20" y="97" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>燃料油品类 · 电子电气类 · 化工品类</tspan>
</text>
<text x="20" y="119" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>金属类 · 复合材料类</tspan>
</text>
<text x="20" y="141" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>→ 归一化为加权组合值</tspan>
</text>
<text x="20" y="163" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#9CA3AF">
<tspan>反映不同物料对火灾发展的贡献</tspan>
</text>
</g>

<!-- Card 3: 热源+遮挡特征 -->
<g transform="translate(854, 80)">
<rect x="0" y="0" width="365" height="180" rx="10" fill="url(#cardGradP4)" stroke="#E5E7EB" stroke-width="1" filter="url(#cardShadow)"/>
<rect x="0" y="0" width="365" height="44" rx="10" fill="#4A90D9"/>
<rect x="0" y="20" width="365" height="24" fill="#4A90D9"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">
<tspan>热源特征 4维 + 遮挡 1维</tspan>
</text>
<text x="20" y="75" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 俯仰角 / 方位角 / 持续时间</tspan>
</text>
<text x="20" y="97" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 热通量（50-15000 W/m²）</tspan>
</text>
<text x="20" y="119" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 遮挡效应：按0.3幂次衰减</tspan>
</text>
<text x="20" y="163" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#9CA3AF">
<tspan>覆盖热辐射全参数空间</tspan>
</text>
</g>

<!-- Unified model architecture section -->
<g transform="translate(60, 285)">
<text x="0" y="25" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B3A6B">
<tspan>统一模型架构：四模型融合</tspan>
</text>

<!-- Architecture flow boxes -->
<!-- Input node -->
<rect x="0" y="50" width="160" height="60" rx="6" fill="#1B3A6B"/>
<text x="80" y="77" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>23维特征向量</tspan>
</text>

<!-- Arrow 1 -->
<rect x="165" y="73" width="30" height="4" rx="2" fill="#2196F3"/>

<!-- Four model nodes -->
<rect x="200" y="50" width="120" height="60" rx="6" fill="#2196F3"/>
<text x="260" y="77" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>SVM</tspan>
</text>
<text x="260" y="90" font-family="Arial, sans-serif" font-size="10" fill="#BBDEFB" text-anchor="middle">
<tspan>76.9%</tspan>
</text>

<rect x="340" y="50" width="120" height="60" rx="6" fill="#16A34A"/>
<text x="400" y="77" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>RF</tspan>
</text>
<text x="400" y="90" font-family="Arial, sans-serif" font-size="10" fill="#BBF1D0" text-anchor="middle">
<tspan>98.1%</tspan>
</text>

<rect x="480" y="50" width="120" height="60" rx="6" fill="#4A90D9"/>
<text x="540" y="77" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>MLP</tspan>
</text>
<text x="540" y="90" font-family="Arial, sans-serif" font-size="10" fill="#BBDEFB" text-anchor="middle">
<tspan>96.3%</tspan>
</text>

<rect x="620" y="50" width="120" height="60" rx="6" fill="#D97706"/>
<text x="680" y="77" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>CNN1D</tspan>
</text>
<text x="680" y="90" font-family="Arial, sans-serif" font-size="10" fill="#FEF3C7" text-anchor="middle">
<tspan>94.0%</tspan>
</text>

<!-- Arrow 2 -->
<rect x="745" y="73" width="30" height="4" rx="2" fill="#2196F3"/>

<!-- Fusion node -->
<rect x="780" y="50" width="120" height="60" rx="6" fill="#1B3A6B" stroke="#2196F3" stroke-width="2"/>
<text x="840" y="72" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>加权融合</tspan>
</text>
<text x="840" y="87" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">
<tspan>RF=27% MLP=26.4%</tspan>
</text>
<text x="840" y="99" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">
<tspan>CNN1D=26.1% SVM=20.6%</tspan>
</text>

<!-- Arrow 3 -->
<rect x="905" y="73" width="30" height="4" rx="2" fill="#2196F3"/>

<!-- Output node -->
<rect x="940" y="50" width="140" height="60" rx="6" fill="#1B3A6B"/>
<text x="1010" y="75" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>毁伤等级</tspan>
</text>
<text x="1010" y="92" font-family="Arial, sans-serif" font-size="11" fill="#4A90D9" text-anchor="middle">
<tspan>Low / Medium / High</tspan>
</text>
</g>

<!-- Two-stage inference note -->
<g transform="translate(60, 430)">
<rect x="0" y="0" width="1160" height="70" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>两阶段推理流程</tspan>
</text>
<text x="20" y="52" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>阶段1：遍历设施内每个单体建筑 → 获取各建筑毁伤等级 + 预测概率 + 不确定度</tspan>
</text>
<text x="20" y="68" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>阶段2：通过汇总算法（最大法/加权法/阈值法）→ 聚合为设施整体毁伤等级</tspan>
</text>
</g>

<!-- Model details in small cards -->
<g transform="translate(60, 520)">
<text x="0" y="20" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>模型细节</tspan>
</text>

<g transform="translate(0, 35)">
<rect x="0" y="0" width="280" height="90" rx="6" fill="url(#cardGradP4)" stroke="#E5E7EB" stroke-width="1"/>
<text x="15" y="22" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A6B"><tspan>SVM（支持向量机）</tspan></text>
<text x="15" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>RBF核 · 适中小规模数据</tspan></text>
<text x="15" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>PyTorch + sklearn · Adam</tspan></text>
<text x="15" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#D97706"><tspan>融合权重: 20.6%</tspan></text>
</g>

<g transform="translate(295, 35)">
<rect x="0" y="0" width="280" height="90" rx="6" fill="url(#cardGradP4)" stroke="#E5E7EB" stroke-width="1"/>
<text x="15" y="22" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A6B"><tspan>RF（随机森林）</tspan></text>
<text x="15" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>100棵决策树 · Bootstrap采样</tspan></text>
<text x="15" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>投票机制输出 · 验证集最高98.8%</tspan></text>
<text x="15" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#16A34A"><tspan>融合权重: 27.0%</tspan></text>
</g>

<g transform="translate(590, 35)">
<rect x="0" y="0" width="280" height="90" rx="6" fill="url(#cardGradP4)" stroke="#E5E7EB" stroke-width="1"/>
<text x="15" y="22" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A6B"><tspan>MLP（多层感知机）</tspan></text>
<text x="15" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>3层: 128-64-32 · ReLU + Dropout</tspan></text>
<text x="15" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>PyTorch · Adam (lr=0.001, wd=1e-4)</tspan></text>
<text x="15" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#4A90D9"><tspan>融合权重: 26.4%</tspan></text>
</g>

<g transform="translate(885, 35)">
<rect x="0" y="0" width="280" height="90" rx="6" fill="url(#cardGradP4)" stroke="#E5E7EB" stroke-width="1"/>
<text x="15" y="22" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A6B"><tspan>CNN1D（一维卷积神经网络）</tspan></text>
<text x="15" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>2层一维卷积 · 局部特征提取</tspan></text>
<text x="15" y="60" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#6B7280"><tspan>PyTorch · Adam (lr=0.001, wd=1e-4)</tspan></text>
<text x="15" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#D97706"><tspan>融合权重: 26.1%</tspan></text>
</g>
</g>

<!-- Footer -->
<text x="60" y="700" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">
<tspan>04 / 16</tspan>
</text>
</svg>