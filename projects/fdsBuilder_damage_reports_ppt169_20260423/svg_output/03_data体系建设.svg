</text>
<g transform="translate(20, 180)">
<rect x="0" y="0" width="80" height="24" rx="4" fill="#16A34A" fill-opacity="0.15"/>
<text x="40" y="17" font-family="Arial, sans-serif" font-size="12" fill="#16A34A" text-anchor="middle"><tspan>Low</tspan></text>
<text x="90" y="17" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280"><tspan>&lt; 25</tspan></text>

<rect x="130" y="0" width="80" height="24" rx="4" fill="#D97706" fill-opacity="0.15"/>
