<text x="220" y="17" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280"><tspan>25-70</tspan></text>

<rect x="260" y="0" width="80" height="24" rx="4" fill="#DC2626" fill-opacity="0.15"/>
