<text x="50" y="474" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="end"><tspan>0</tspan></text>

<!-- Bars: height calculation: y = 470 - (value/100 * 395) = 470 - value*3.95 -->
<!-- SVM: 76.9% -> height = 76.9*3.95 = 303.76, y = 470-303.76 = 166.24 -->
<!-- RF: 98.1% -> height = 98.1*3.95 = 387.50, y = 470-387.50 = 82.50 -->
<!-- MLP: 96.3% -> height = 96.3*3.95 = 380.39, y = 470-380.39 = 89.61 -->
<!-- CNN1D: 94.0% -> height = 94.0*3.95 = 371.30, y = 470-371.30 = 98.70 -->

