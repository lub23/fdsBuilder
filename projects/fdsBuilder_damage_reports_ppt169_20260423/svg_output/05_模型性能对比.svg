<text x="10" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A2E"><tspan>Airport Hangar</tspan></text>
<text x="90" y="368" font-family="Arial, sans-serif" font-size="11" fill="#D97706"><tspan>84.2%</tspan></text>
