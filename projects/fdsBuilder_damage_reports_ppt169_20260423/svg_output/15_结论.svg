<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
<linearGradient id="conclusionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1B3A6B"/>
<stop offset="100%" stop-color="#0F2540"/>
</linearGradient>
<linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#16A34A"/>
<stop offset="100%" stop-color="#4ADE80"/>
</linearGradient>
</defs>

<rect width="1280" height="720" fill="#FFFFFF"/>

<!-- Dark header band -->
<rect x="0" y="0" width="1280" height="200" fill="url(#conclusionGrad)"/>

<!-- Section label -->
<text x="60" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A90D9">
<tspan>06 结论</tspan>
</text>

<!-- Main title -->
<text x="60" y="115" font-family="Microsoft YaHei, Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">
<tspan>热毁伤代理模型研究核心结论</tspan>
</text>

<!-- Decorative line -->
<rect x="60" y="135" width="200" height="3" rx="1.5" fill="#2196F3"/>

<!-- Four hero KPI cards -->
<g transform="translate(60, 170)">
<rect x="0" y="0" width="260" height="60" rx="6" fill="#16A34A" fill-opacity="0.15" stroke="#16A34A" stroke-width="1"/>
<text x="130" y="38" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#16A34A" text-anchor="middle">
<tspan>98.1%</tspan>
</text>
<text x="130" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
<tspan>RF随机森林准确率</tspan>
</text>

<rect x="280" y="0" width="260" height="60" rx="6" fill="#2196F3" fill-opacity="0.15" stroke="#2196F3" stroke-width="1"/>
<text x="410" y="38" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2196F3" text-anchor="middle">
<tspan>96.3%</tspan>
</text>
<text x="410" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
<tspan>MLP多层感知机准确率</tspan>
</text>

<rect x="560" y="0" width="260" height="60" rx="6" fill="#4A90D9" fill-opacity="0.15" stroke="#4A90D9" stroke-width="1"/>
<text x="690" y="38" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#4A90D9" text-anchor="middle">
<tspan>94.0%</tspan>
</text>
<text x="690" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
<tspan>CNN1D一维卷积准确率</tspan>
</text>

<rect x="840" y="0" width="300" height="60" rx="6" fill="#D97706" fill-opacity="0.15" stroke="#D97706" stroke-width="1"/>
<text x="990" y="38" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#D97706" text-anchor="middle">
<tspan>3-4级</tspan>
</text>
<text x="990" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
<tspan>效率提升数量级</tspan>
</text>
</g>

<!-- Key findings -->
<g transform="translate(60, 280)">
<text x="0" y="0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1B3A6B">
<tspan>核心成果</tspan>
</text>

<!-- Finding 1: Unified model -->
<g transform="translate(0, 20)">
<rect x="0" y="0" width="555" height="85" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<rect x="0" y="0" width="8" height="85" rx="4" fill="#1B3A6B"/>
<text x="24" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>统一模型架构验证成功</tspan>
</text>
<text x="24" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>RF=98.1%, MLP=96.3%, CNN1D=94.0% — 四模型融合架构在Aerospace / Machinery / Metallurgical三类设施上均展现了稳定的预测准确性</tspan>
</text>
</g>

<g transform="translate(575, 20)">
<rect x="0" y="0" width="555" height="85" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<rect x="0" y="0" width="8" height="85" rx="4" fill="#16A34A"/>
<text x="24" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">
<tspan>秒级推理效率</tspan>
</text>
<text x="24" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>代理模型将火灾毁伤评估从FDS小时级精细仿真压缩至秒级计算，实现3-4个数量级的效率提升</tspan>
</text>
</g>

<g transform="translate(0, 120)">
<rect x="0" y="0" width="555" height="85" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<rect x="0" y="0" width="8" height="85" rx="4" fill="#2196F3"/>
<text x="24" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">
<tspan>多场景泛化能力</tspan>
</text>
<text x="24" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>Airport Hangar集成准确率97.7%, Machinery 99.6%, Metallurgical 95.1% — 模型在不同工业设施场景上展现了良好的适应性</tspan>
</text>
</g>

<g transform="translate(575, 120)">
<rect x="0" y="0" width="555" height="85" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
<rect x="0" y="0" width="8" height="85" rx="4" fill="#D97706"/>
<text x="24" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E">
<tspan>可解释预测输出</tspan>
</text>
<text x="24" y="55" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>两阶段推理流程提供每建筑毁伤等级+预测概率+不确定度，支持最大法/加权法/阈值法三种汇总策略</tspan>
</text>
</g>
</g>

<!-- Application value -->
<g transform="translate(60, 515)">
<text x="0" y="0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1B3A6B">
<tspan>应用价值</tspan>
</text>

<g transform="translate(0, 20)">
<rect x="0" y="0" width="365" height="75" rx="8" fill="#EBF5FF" stroke="#2196F3" stroke-width="1"/>
<text x="20" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">
<tspan>快速火灾风险筛查</tspan>
</text>
<text x="20" y="52" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">
<tspan>数秒内完成多情景批量分析</tspan>
</text>
</g>

<g transform="translate(385, 20)">
<rect x="0" y="0" width="365" height="75" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
<text x="20" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">
<tspan>多情景批量分析</tspan>
</text>
<text x="20" y="52" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">
<tspan>支持不同热辐射情景组合评估</tspan>
</text>
</g>

<g transform="translate(770, 20)">
<rect x="0" y="0" width="360" height="75" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
<text x="20" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E">
<tspan>应急预案支撑</tspan>
</text>
<text x="20" y="52" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#6B7280">
<tspan>识别最危险情景和最脆弱建筑</tspan>
</text>
</g>
</g>

<!-- Footer -->
<text x="60" y="700" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">
<tspan>15 / 16</tspan>
</text>
</svg>