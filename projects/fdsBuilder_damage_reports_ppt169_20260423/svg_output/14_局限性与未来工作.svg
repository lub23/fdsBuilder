<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
<linearGradient id="cardGradP14" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#F8FAFC"/>
<stop offset="100%" stop-color="#FFFFFF"/>
</linearGradient>
</defs>

<rect width="1280" height="720" fill="#FFFFFF"/>

<!-- Header -->
<rect x="0" y="0" width="1280" height="60" fill="#1B3A6B"/>
<text x="60" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">
<tspan>05 局限性与未来工作</tspan>
</text>
<text x="1220" y="38" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A90D9" text-anchor="end">
<tspan>综合对比</tspan>
</text>

<!-- Left column: Limitations -->
<g transform="translate(60, 85)">
<text x="0" y="25" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B3A6B">
<tspan>当前局限性</tspan>
</text>

<!-- Data limitation card -->
<g transform="translate(0, 45)">
<rect x="0" y="0" width="555" height="130" rx="10" fill="url(#cardGradP14)" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="0" y="0" width="555" height="44" rx="10" fill="#B91C1C" fill-opacity="0.1"/>
<rect x="0" y="20" width="555" height="24" fill="#B91C1C" fill-opacity="0.1"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#991B1B">
<tspan>数据层面：合成数据与真实仿真存在差距</tspan>
</text>
<text x="20" y="75" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 简化热负荷模型假设热辐射垂直入射</tspan>
</text>
<text x="20" y="97" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 忽略烟气层的遮蔽效应</tspan>
</text>
<text x="20" y="119" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 可燃物因子采用固定权重</tspan>
</text>
</g>

<!-- Model limitation card -->
<g transform="translate(0, 190)">
<rect x="0" y="0" width="555" height="130" rx="10" fill="url(#cardGradP14)" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="0" y="0" width="555" height="44" rx="10" fill="#D97706" fill-opacity="0.1"/>
<rect x="0" y="20" width="555" height="24" fill="#D97706" fill-opacity="0.1"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400E">
<tspan>模型层面：SVM表现差，CNN1D泛化受限</tspan>
</text>
<text x="20" y="75" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• SVM准确率仅76.9%，在融合中引入噪声</tspan>
</text>
<text x="20" y="97" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• CNN1D在高多样性场景（Metallurgical）下降至90.2%</tspan>
</text>
<text x="20" y="119" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 仅输出三级离散标签，可考虑回归模式</tspan>
</text>
</g>

<!-- Generalization limitation -->
<g transform="translate(0, 335)">
<rect x="0" y="0" width="555" height="95" rx="10" fill="url(#cardGradP14)" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="0" y="0" width="555" height="44" rx="10" fill="#6B7280" fill-opacity="0.1"/>
<rect x="0" y="20" width="555" height="24" fill="#6B7280" fill-opacity="0.1"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#374151">
<tspan>泛化层面：覆盖范围有限</tspan>
</text>
<text x="20" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 当前覆盖Aerospace / Airport Hangar / Machinery / Metallurgical四类</tspan>
</text>
<text x="20" y="88" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 其他设施（化工园/港口码头/数据中心）泛化能力未知</tspan>
</text>
</g>

<!-- Training curves image -->
<text x="0" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>模型训练过程:</tspan>
</text>
<image href="../images/training_curves_all.png" x="0" y="470" width="555" height="155" preserveAspectRatio="xMidYMid meet"/>
</g>

<!-- Right column: Future work -->
<g transform="translate(640, 85)">
<text x="0" y="25" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1B3A6B">
<tspan>未来工作计划</tspan>
</text>

<!-- FDS real simulation -->
<g transform="translate(0, 45)">
<rect x="0" y="0" width="580" height="110" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<rect x="0" y="0" width="580" height="44" rx="10" fill="#DCFCE7"/>
<rect x="0" y="20" width="580" height="24" fill="#DCFCE7"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">
<tspan>数据层面：FDS真实火灾仿真数据替换</tspan>
</text>
<text x="20" y="75" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 当FDS仿真数据积累充分后，以真实仿真结果替换合成数据</tspan>
</text>
<text x="20" y="97" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 对毁伤阈值和可燃物权重进行物理校准</tspan>
</text>
</g>

<!-- SVM removal -->
<g transform="translate(0, 170)">
<rect x="0" y="0" width="580" height="90" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<rect x="0" y="0" width="580" height="44" rx="10" fill="#DCFCE7"/>
<rect x="0" y="20" width="580" height="24" fill="#DCFCE7"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">
<tspan>模型层面：SVM剔除 + 连续毁伤指数</tspan>
</text>
<text x="20" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 若FDS数据集验证后SVM仍显著落后，从融合中剔除</tspan>
</text>
<text x="20" y="88" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 考虑回归模式输出连续毁伤指数，支撑精细风险排序</tspan>
</text>
</g>

<!-- Expand facility types -->
<g transform="translate(0, 275)">
<rect x="0" y="0" width="580" height="90" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
<rect x="0" y="0" width="580" height="44" rx="10" fill="#DCFCE7"/>
<rect x="0" y="20" width="580" height="24" fill="#DCFCE7"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">
<tspan>泛化层面：扩展设施类型 + 迁移学习</tspan>
</text>
<text x="20" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 引入更多设施类型（化工园/港口码头/数据中心）</tspan>
</text>
<text x="20" y="88" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 研究跨设施类型的少样本迁移学习方法</tspan>
</text>
</g>

<!-- Power plant differentiated models -->
<g transform="translate(0, 380)">
<rect x="0" y="0" width="580" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<rect x="0" y="0" width="580" height="44" rx="10" fill="#FEF3C7"/>
<rect x="0" y="20" width="580" height="24" fill="#FEF3C7"/>
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400E">
<tspan>建筑尺度差异化：专用电厂专项模型</tspan>
</text>
<text x="20" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 专用电厂高度范围8-110m，当前等效仅取中位数25m</tspan>
</text>
<text x="20" y="88" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>• 计划针对大型/中型/小型专用电厂分别建立差异化模型</tspan>
</text>
</g>

<!-- Damage distribution global comparison -->
<text x="0" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>四类设施毁伤分布对比:</tspan>
</text>
<image href="../images/damage_distribution_by_facility.png" x="0" y="510" width="580" height="145" preserveAspectRatio="xMidYMid meet"/>
</g>

<!-- Footer -->
<text x="60" y="700" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">
<tspan>14 / 16</tspan>
</text>
</svg>