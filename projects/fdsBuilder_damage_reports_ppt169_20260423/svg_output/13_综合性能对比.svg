<!-- Color mapping function: value -> color
70-75: #DC2626 (red)
76-80: #D97706 (orange)
81-85: #F59E0B (amber)
86-90: #FCD34D (yellow)
91-95: #84CC16 (lime)
96-100: #16A34A (green)
For each cell: calculate position in 0-30 range (70-100 = 30 pct points)
But easier: just use specific colors based on ranges -->

