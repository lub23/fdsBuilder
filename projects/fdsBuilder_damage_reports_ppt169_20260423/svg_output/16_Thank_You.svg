<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
<linearGradient id="thankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1B3A6B"/>
<stop offset="50%" stop-color="#0F2540"/>
<stop offset="100%" stop-color="#091A2E"/>
</linearGradient>
</defs>

<rect width="1280" height="720" fill="url(#thankGrad)"/>

<!-- Decorative geometric elements -->
<g transform="translate(0, 0)">
<rect x="1000" y="0" width="280" height="280" fill="#FFFFFF" fill-opacity="0.02"/>
<polygon points="1280,0 1280,280 1000,280" fill="#FFFFFF" fill-opacity="0.03"/>
</g>

<!-- Large decorative "谢谢" in background -->
<text x="640" y="350" font-family="Microsoft YaHei, Microsoft YaHei, sans-serif" font-size="200" font-weight="bold" fill="#FFFFFF" fill-opacity="0.03" text-anchor="middle">
<tspan>谢谢</tspan>
</text>

<!-- Main thank you text -->
<text x="640" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
<tspan>谢谢</tspan>
</text>

<!-- Decorative accent line -->
<rect x="490" y="310" width="300" height="4" rx="2" fill="#2196F3"/>

<!-- Subtitle -->
<text x="640" y="370" font-family="Arial, sans-serif" font-size="24" fill="#4A90D9" text-anchor="middle">
<tspan>Questions &amp; Discussion</tspan>
</text>

<!-- Contact / team info -->
<g transform="translate(640, 450)">
<text x="0" y="0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#6B7280" text-anchor="middle">
<tspan>FDS Builder 项目组</tspan>
</text>
<text x="0" y="30" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A90D9" text-anchor="middle">
<tspan>2026年4月</tspan>
</text>
</g>

<!-- Decorative circles -->
<g transform="translate(1000, 350)">
<circle cx="0" cy="0" r="80" fill="#2196F3" fill-opacity="0.05"/>
<circle cx="0" cy="0" r="50" fill="#2196F3" fill-opacity="0.08"/>
<circle cx="0" cy="0" r="25" fill="#2196F3" fill-opacity="0.15"/>
</g>

<!-- Bottom bar -->
<rect x="0" y="680" width="1280" height="40" fill="#2196F3" fill-opacity="0.15"/>
<text x="640" y="700" font-family="Arial, sans-serif" font-size="12" fill="#4A90D9" fill-opacity="0.6" text-anchor="middle">
<tspan>热毁伤代理模型研究报告 · FDS Builder</tspan>
</text>
</svg>