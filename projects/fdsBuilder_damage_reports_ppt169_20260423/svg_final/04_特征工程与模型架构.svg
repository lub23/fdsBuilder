<g transform="translate(60, 430)">
<path fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1" d="M8,0 H1152 A8,8 0 0 1 1160,8 V62 A8,8 0 0 1 1152,70 H8 A8,8 0 0 1 0,62 V8 A8,8 0 0 1 8,0 Z" />
<text x="20" y="28" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A6B">
<tspan>两阶段推理流程</tspan>
</text>
<text x="20" y="52" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>阶段1：遍历设施内每个单体建筑 → 获取各建筑毁伤等级 + 预测概率 + 不确定度</tspan>
</text>
<text x="20" y="68" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#1A1A2E">
<tspan>阶段2：通过汇总算法（最大法/加权法/阈值法）→ 聚合为设施整体毁伤等级</tspan>
</text>
</g>


